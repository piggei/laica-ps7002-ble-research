name: "Sample measurement / algorithm validation"
description: "Submit one LAICA/YoHealth weighing to validate the recovered algorithm and device compatibility."
title: "[MEASUREMENT] "
labels: ["measurement", "validation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping validate the recovered YoHealth/LAICA algorithm and cross-device compatibility.

        Please submit **one complete weighing per issue** when possible. Do not include your name, exact date of birth, account identifiers, or unrelated health information. Age in whole years is sufficient.

        Some app versions do not display every historical YoHealth field. Use `not displayed` where appropriate rather than guessing a value.

  - type: input
    id: device_model
    attributes:
      label: Scale model
      description: Exact manufacturer and model printed on the scale or shown in the app.
      placeholder: "e.g. LAICA PS7002, LAICA PS7200L, ..."
    validations:
      required: true

  - type: input
    id: app
    attributes:
      label: App and version
      description: Companion app used to display the reference values.
      placeholder: "LAICA Home Wellness / version ..."
    validations:
      required: false

  - type: dropdown
    id: profile_sex
    attributes:
      label: Sex selected in the app profile
      description: Needed for sex-specific formulas. Choose Not disclosed if preferred.
      options:
        - Male
        - Female
        - Not disclosed
    validations:
      required: true

  - type: input
    id: profile_age
    attributes:
      label: Age used by the app (years)
      description: Age in whole years only; do not enter an exact date of birth.
      placeholder: "55"
    validations:
      required: false

  - type: input
    id: profile_height
    attributes:
      label: Height used by the app (cm)
      placeholder: "175"
    validations:
      required: false

  - type: input
    id: weight
    attributes:
      label: Weight shown by the scale/app (kg)
      placeholder: "80.7"
    validations:
      required: true

  - type: input
    id: impedance
    attributes:
      label: Raw health / impedance value
      description: Decimal value decoded from bytes 6..7 of the 14-byte NimBLE Manufacturer Data frame, if available.
      placeholder: "665"
    validations:
      required: false

  - type: input
    id: status
    attributes:
      label: Final status byte
      description: PS7002 complete body-composition measurements normally use 0x86.
      placeholder: "0x86"
    validations:
      required: false

  - type: input
    id: mode
    attributes:
      label: Device mode / precision byte
      description: Byte 11 of Manufacturer Data. PS7002 normally uses 0x21.
      placeholder: "0x21"
    validations:
      required: false

  - type: input
    id: raw_mfg
    attributes:
      label: Final Manufacturer Data frame
      description: Paste the complete 14-byte NimBLE Manufacturer Data value if available.
      placeholder: "02 A1 09 FF 03 27 02 99 86 FF FF 21 15 AA"
    validations:
      required: false

  - type: textarea
    id: app_values
    attributes:
      label: Values shown by the app
      description: Enter every value available. Use `not displayed` for hidden fields.
      placeholder: |
        BMI: 26.35
        Body fat: 23.28 %
        Water: 56.00 %
        Muscle: 38.73 %
        Bone mass: not displayed
        Visceral fat: not displayed
        Body age: not displayed
        BMR: 1673 kcal/day
    validations:
      required: true

  - type: textarea
    id: logger_output
    attributes:
      label: ESP32 final measurement output
      description: Paste the complete FINAL MEASUREMENT block from the research firmware if available.
      render: text
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything unusual about electrode contact, units, app behavior, or repeated attempts.
    validations:
      required: false

  - type: checkboxes
    id: consent
    attributes:
      label: Submission checks
      options:
        - label: I have removed names, exact dates of birth, account identifiers, and other unnecessary identifying information.
          required: true
        - label: This measurement comes from my own device/data or I have permission to share it.
          required: true
